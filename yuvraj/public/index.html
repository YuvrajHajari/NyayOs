<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NyayOS — Case Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; color: #1a1a2e; }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .logo { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    header .logo span { color: #f4a261; }
    header .subtitle { font-size: 12px; color: #aaa; margin-top: 2px; }

    .container { display: flex; height: calc(100vh - 60px); }

    .sidebar {
      width: 380px;
      min-width: 320px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
    }
    .sidebar-header h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filters select {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      cursor: pointer;
    }
    #case-count { font-size: 12px; color: #777; margin-top: 8px; }

    .case-list { overflow-y: auto; flex: 1; }
    .case-card {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s;
    }
    .case-card:hover { background: #f5f7ff; }
    .case-card.active { background: #eef1ff; border-left: 3px solid #4361ee; }
    .case-card .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .case-card .meta { font-size: 12px; color: #666; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .case-card .location { color: #999; font-size: 11px; margin-top: 3px; }
    .case-card .summary-preview { font-size: 12px; color: #555; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .detail {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      background: #f0f2f5;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #999;
      gap: 12px;
    }
    .empty-state .icon { font-size: 48px; }

    .detail-card {
      background: #fff;
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .detail-card h3 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      margin-bottom: 14px;
    }

    .case-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .case-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .meta-item label { font-size: 11px; color: #999; display: block; margin-bottom: 2px; }
    .meta-item span { font-size: 14px; font-weight: 500; }

    .status-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .status-btn {
      padding: 6px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      transition: all 0.15s;
    }
    .status-btn:hover { border-color: #4361ee; color: #4361ee; }
    .status-btn.active { background: #4361ee; color: #fff; border-color: #4361ee; }

    .facts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fact-item { background: #f8f9fa; border-radius: 6px; padding: 10px 14px; }
    .fact-item label { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }
    .fact-item span { font-size: 13px; font-weight: 500; word-break: break-word; }

    /* Document tabs */
    .doc-tabs { display: flex; gap: 0; margin-bottom: 0; border-bottom: 2px solid #eee; }
    .doc-tab {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      color: #888;
      transition: all 0.15s;
    }
    .doc-tab.active { color: #4361ee; border-bottom-color: #4361ee; }
    .doc-tab:hover { color: #4361ee; }
    .doc-panel { display: none; margin-top: 14px; }
    .doc-panel.active { display: block; }

    .doc-box {
      background: #f8f9fb;
      border: 1px solid #e0e4f0;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.7;
      max-height: 320px;
      overflow-y: auto;
    }

    .docs-required-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .doc-chip {
      background: #f0f4ff;
      border: 1px solid #c7d2fe;
      color: #3730a3;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
    }

    .transcript-box {
      background: #fafafa;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.7;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .missing-field-chip {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      display: inline-block;
      margin: 3px;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-urgency-high   { background: #fee2e2; color: #dc2626; }
    .badge-urgency-medium { background: #fef3c7; color: #d97706; }
    .badge-urgency-low    { background: #d1fae5; color: #059669; }

    .badge-status-new             { background: #dbeafe; color: #1d4ed8; }
    .badge-status-info_needed     { background: #fef3c7; color: #b45309; }
    .badge-status-draft_generated { background: #ede9fe; color: #7c3aed; }
    .badge-status-submitted       { background: #d1fae5; color: #065f46; }
    .badge-status-followup_due    { background: #ffedd5; color: #c2410c; }
    .badge-status-resolved        { background: #f0fdf4; color: #166534; }

    .badge-issue-unpaid_salary    { background: #fef9c3; color: #713f12; }
    .badge-issue-fir_refusal      { background: #fee2e2; color: #991b1b; }
    .badge-issue-deposit_withheld { background: #dbeafe; color: #1e40af; }
    .badge-issue-pension_delay    { background: #f0fdf4; color: #14532d; }

    .next-step-box {
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .loading { text-align: center; color: #999; padding: 40px; font-size: 14px; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1a1a2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Nyay<span>OS</span></div>
    <div class="subtitle">NGO Case Management Dashboard</div>
  </div>
  <div style="font-size:12px; color:#aaa;" id="live-count">Loading cases...</div>
</header>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Cases</h2>
      <div class="filters">
        <select id="filter-issue" onchange="loadCases()">
          <option value="">All Issues</option>
          <option value="unpaid_salary">Unpaid Salary</option>
          <option value="fir_refusal">FIR Refusal</option>
          <option value="deposit_withheld">Deposit Withheld</option>
          <option value="pension_delay">Pension Delay</option>
        </select>
        <select id="filter-urgency" onchange="loadCases()">
          <option value="">All Urgency</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="filter-status" onchange="loadCases()">
          <option value="">All Status</option>
          <option value="new">New</option>
          <option value="info_needed">Info Needed</option>
          <option value="draft_generated">Draft Generated</option>
          <option value="submitted">Submitted</option>
          <option value="followup_due">Follow-up Due</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <div id="case-count"></div>
    </div>
    <div class="case-list" id="case-list">
      <div class="loading">Loading cases...</div>
    </div>
  </div>

  <div class="detail" id="detail">
    <div class="empty-state">
      <div class="icon">⚖️</div>
      <div style="font-size:16px; font-weight:600;">Select a case to view details</div>
      <div style="font-size:13px;">Cases are created automatically when a citizen calls NyayOS</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let allCases = [];
  let activeId = null;

  const ISSUE_LABELS = {
    unpaid_salary: 'Unpaid Salary',
    fir_refusal: 'FIR Refusal',
    deposit_withheld: 'Deposit Withheld',
    pension_delay: 'Pension Delay',
  };

  const STATUS_LABELS = {
    new: 'New',
    info_needed: 'Info Needed',
    draft_generated: 'Draft Generated',
    submitted: 'Submitted',
    followup_due: 'Follow-up Due',
    resolved: 'Resolved',
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function loadCases() {
    const issue   = document.getElementById('filter-issue').value;
    const urgency = document.getElementById('filter-urgency').value;
    const status  = document.getElementById('filter-status').value;

    const params = new URLSearchParams();
    if (issue)   params.append('issue_type', issue);
    if (urgency) params.append('urgency', urgency);
    if (status)  params.append('status', status);

    try {
      const res = await fetch(`/cases?${params}`);
      allCases = await res.json();
      renderList(allCases);
      document.getElementById('live-count').textContent =
        `${allCases.length} case${allCases.length !== 1 ? 's' : ''} total`;
    } catch (e) {
      document.getElementById('case-list').innerHTML =
        '<div class="loading">⚠️ Could not load cases. Is the server running?</div>';
    }
  }

  function renderList(cases) {
    const el = document.getElementById('case-list');
    document.getElementById('case-count').textContent =
      `Showing ${cases.length} case${cases.length !== 1 ? 's' : ''}`;

    if (!cases.length) {
      el.innerHTML = '<div class="loading">No cases match the filters.</div>';
      return;
    }

    el.innerHTML = cases.map(c => `
      <div class="case-card ${c.case_id === activeId ? 'active' : ''}"
           onclick="loadDetail('${c.case_id}')">
        <div class="name">${c.caller_name}</div>
        <div class="meta">
          <span class="badge badge-issue-${c.issue_type}">${ISSUE_LABELS[c.issue_type] || c.issue_type}</span>
          <span class="badge badge-urgency-${c.urgency}">${c.urgency}</span>
          <span class="badge badge-status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>
        </div>
        <div class="location">📍 ${c.location || '—'} · ${timeAgo(c.created_at)}</div>
        <div class="summary-preview">${c.summary}</div>
      </div>
    `).join('');
  }

  async function loadDetail(caseId) {
    activeId = caseId;
    renderList(allCases);
    const detail = document.getElementById('detail');
    detail.innerHTML = '<div class="loading">Loading...</div>';

    try {
      const res = await fetch(`/cases/${caseId}`);
      const c = await res.json();
      renderDetail(c);
    } catch (e) {
      detail.innerHTML = '<div class="loading">⚠️ Could not load case detail.</div>';
    }
  }

  function renderDetail(c) {
    // Key facts grid
    const factsHtml = Object.entries(c.facts || {}).map(([k, v]) => {
      let display = v;
      if (v === true) display = '✅ Yes';
      else if (v === false) display = '❌ No';
      else if (Array.isArray(v)) display = v.join(', ');
      return `<div class="fact-item">
        <label>${k.replace(/_/g,' ').toUpperCase()}</label>
        <span>${display}</span>
      </div>`;
    }).join('');

    // Status buttons
    const statusButtons = Object.keys(STATUS_LABELS).map(s => `
      <button class="status-btn ${c.status === s ? 'active' : ''}"
        onclick="updateStatus('${c.case_id}', '${s}')">${STATUS_LABELS[s]}</button>
    `).join('');

    // Documents section — tabs if multiple, single box if one or none
    let docsHtml = '';
    const templates = c.document_templates || [];

    if (templates.length === 0) {
      // Fallback to old generated_document field
      docsHtml = c.generated_document
        ? `<div class="doc-box">${escHtml(c.generated_document)}</div>`
        : `<p style="color:#999;font-size:13px;">No document generated yet.</p>`;
    } else if (templates.length === 1) {
      docsHtml = buildDocContent(templates[0]);
    } else {
      // Multiple documents — tabbed UI
      const tabs = templates.map((t, i) => `
        <div class="doc-tab ${i === 0 ? 'active' : ''}"
             onclick="switchTab(${i})"
             id="tab-${i}">Doc ${i + 1}: ${shortTitle(t.template_name || t.title)}</div>
      `).join('');

      const panels = templates.map((t, i) => `
        <div class="doc-panel ${i === 0 ? 'active' : ''}" id="panel-${i}">
          <div style="font-size:12px;color:#888;margin-bottom:8px;">${escHtml(t.title || '')}</div>
          ${buildDocContent(t)}
        </div>
      `).join('');

      docsHtml = `<div class="doc-tabs">${tabs}</div>${panels}`;
    }

    // Documents required chips
    const docsRequired = (c.documents_required || []).map(d =>
      `<span class="doc-chip">📎 ${escHtml(d)}</span>`
    ).join('');

    // Missing fields
    const missingHtml = (c.missing_fields || []).length
      ? (c.missing_fields.map(f => `<span class="missing-field-chip">⚠️ ${escHtml(f)}</span>`).join(''))
      : '<span style="color:#059669;font-size:13px;">✅ All information collected</span>';

    // Transcript — prefer transcript_summary, fall back to transcript
    const transcriptText = c.transcript_summary || c.transcript || 'No transcript available.';

    document.getElementById('detail').innerHTML = `
      <div class="detail-card">
        <div class="case-title">${escHtml(c.caller_name)}</div>
        <div class="case-meta-grid">
          <div class="meta-item"><label>Issue Type</label><span class="badge badge-issue-${c.issue_type}">${ISSUE_LABELS[c.issue_type] || c.issue_type}</span></div>
          <div class="meta-item"><label>Urgency</label><span class="badge badge-urgency-${c.urgency}">${c.urgency}</span></div>
          <div class="meta-item"><label>Phone</label><span>${escHtml(c.phone || '—')}</span></div>
          <div class="meta-item"><label>Location</label><span>${escHtml(c.location || '—')}</span></div>
          <div class="meta-item"><label>Language</label><span>${escHtml(c.language || '—')}</span></div>
          <div class="meta-item"><label>Case ID</label><span style="font-size:12px;color:#888;">${c.case_id}</span></div>
          <div class="meta-item"><label>Created</label><span>${formatDate(c.created_at)}</span></div>
          <div class="meta-item"><label>Updated</label><span>${formatDate(c.updated_at)}</span></div>
        </div>
      </div>

      <div class="detail-card">
        <h3>📝 Summary</h3>
        <p style="font-size:14px;line-height:1.6;">${escHtml(c.summary)}</p>
      </div>

      <div class="detail-card">
        <h3>🔑 Key Facts</h3>
        <div class="facts-grid">${factsHtml || '<span style="color:#999;font-size:13px;">No structured facts available.</span>'}</div>
      </div>

      <div class="detail-card">
        <h3>⚠️ Missing Information</h3>
        ${missingHtml}
      </div>

      <div class="detail-card">
        <h3>✅ Recommended Next Step</h3>
        <div class="next-step-box">${escHtml(c.next_step || 'Awaiting agent analysis.')}</div>
      </div>

      <div class="detail-card">
        <h3>🔄 Update Status</h3>
        <p style="font-size:12px;color:#888;margin-bottom:10px;">Current: <strong>${STATUS_LABELS[c.status] || c.status}</strong></p>
        <div class="status-selector">${statusButtons}</div>
      </div>

      <div class="detail-card">
        <h3>📄 Generated Documents</h3>
        ${docsHtml}
      </div>

      ${docsRequired ? `<div class="detail-card">
        <h3>📎 Documents Required from Citizen</h3>
        <div class="docs-required-list">${docsRequired}</div>
      </div>` : ''}

      <div class="detail-card">
        <h3>🎙️ Call Summary</h3>
        <div class="transcript-box">${escHtml(transcriptText)}</div>
      </div>
    `;
  }

  function buildDocContent(template) {
    const fields = template.fields || {};
    if (Object.keys(fields).length === 0) {
      return `<div class="doc-box">${escHtml(template.title || 'Document')}</div>`;
    }

    const type = template.document_type || '';
    let docText = '';

    if (type === 'salary_demand_legal_notice_style') {
      docText = `To,
${escHtml(fields.notice_recipient || 'The Management')}
${escHtml(fields.employer_name || '')}
${escHtml(fields.employer_address || '')}

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Demand for Payment of Pending Salary

Sir/Madam,

I, ${escHtml(fields.employee_name || '')}, currently employed as ${escHtml(fields.role || '')} at your organization since ${escHtml(fields.joining_date || '')}, write to formally bring to your notice that my salary for ${escHtml(fields.unpaid_period || '')} amounting to ${escHtml(fields.salary || '')} has not been paid to me.

The total amount due is ${escHtml(fields.amount_due || '')}. I have the following proofs of employment and services rendered: ${escHtml(fields.proof_list || '')}.

I hereby call upon you to make the payment of the above amount within ${escHtml((fields.deadline || '15 days').replace(' days',''))} days from the date of this notice, failing which I will be constrained to initiate appropriate legal proceedings under the Payment of Wages Act, 1936 and other applicable laws.

Yours faithfully,
${escHtml(fields.employee_name || '')}
${escHtml(fields.phone || '')}
${escHtml(fields.employee_address || '')}`;

    } else if (type === 'labour_complaint') {
      docText = `To,
The Labour Officer / Labour Commissioner
[Jurisdiction Office]

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Complaint regarding non-payment of salary/wages by ${escHtml(fields.employer_name || '')}

Respected Sir/Madam,

I, ${escHtml(fields.employee_name || '')}, residing at ${escHtml(fields.employee_address || '')}, contact: ${escHtml(fields.phone || '')}, am employed as ${escHtml(fields.role || '')} at ${escHtml(fields.employer_name || '')}, located at ${escHtml(fields.work_location || '')}, since ${escHtml(fields.joining_date || '')}.

My agreed salary is ${escHtml(fields.salary || '')} per month. My salary for ${escHtml(fields.unpaid_period || '')} amounting to ${escHtml(fields.amount_due || '')} has not been paid. My current employment status: ${escHtml(fields.current_status || '')}.

I have the following supporting documents: ${escHtml(fields.proof_list || '')}.

I request your kind intervention to direct my employer to pay the pending wages immediately under the Payment of Wages Act, 1936 / Minimum Wages Act, 1948.

Yours faithfully,
${escHtml(fields.employee_name || '')}
${escHtml(fields.phone || '')}`;

    } else if (type === 'complaint_to_sp') {
      docText = `To,
The Superintendent of Police / DCP
[Jurisdiction District]

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Complaint regarding refusal to register FIR at ${escHtml(fields.police_station_name || '')}

Respected Sir/Madam,

I, ${escHtml(fields.caller_name || '')}, residing at ${escHtml(fields.location || '')}, contact: ${escHtml(fields.phone || '')}, write to bring to your notice that on ${escHtml(fields.date_of_visit || '')}, I visited ${escHtml(fields.police_station_name || '')}, located at ${escHtml(fields.police_station_address || '')}, to file a complaint regarding ${escHtml(fields.incident_type || '')} that occurred on ${escHtml(fields.incident_date || '')} at ${escHtml(fields.incident_location || '')}.

The accused person(s): ${escHtml(fields.accused_details || '')}.

The officer I spoke to (${escHtml(fields.officer_spoken_to || '')}) refused to register my FIR. Reason given: ${escHtml(fields.refusal_reason || 'none stated')}.

I have the following supporting documents: ${escHtml(fields.proof_list || '')}.

I request your kind intervention to direct the concerned police station to register my FIR immediately under Section 154 CrPC.

Yours faithfully,
${escHtml(fields.caller_name || '')}
${escHtml(fields.phone || '')}
${escHtml(fields.location || '')}`;

    } else if (type === 'magistrate_application') {
      docText = `To,
The Hon'ble Judicial Magistrate
[Jurisdiction Court]

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Application under Section 156(3) CrPC for directing registration of FIR

Respected Sir/Madam,

I, ${escHtml(fields.caller_name || '')}, residing at ${escHtml(fields.location || '')}, contact: ${escHtml(fields.phone || '')}, respectfully submit that:

1. An incident of ${escHtml(fields.incident_type || '')} occurred on ${escHtml(fields.incident_date || '')}.
2. The accused: ${escHtml(fields.accused_details || '')}.
3. I approached ${escHtml(fields.police_station_name || '')} to file an FIR but was refused.
4. Reason for refusal: ${escHtml(fields.refusal_reason || 'none stated')}.
5. Written complaint submitted: ${escHtml(fields.written_complaint_submitted || '')}.
6. Senior officer approached: ${escHtml(fields.senior_officer_approached || 'no')}.

Supporting documents: ${escHtml(fields.proof_list || '')}.

I humbly pray that this Hon'ble Court may direct the concerned police station to register my FIR and investigate the matter.

Yours faithfully,
${escHtml(fields.caller_name || '')}
${escHtml(fields.phone || '')}`;

    } else if (type === 'legal_notice_to_landlord') {
      docText = `To,
${escHtml(fields.landlord_name || 'The Landlord')}
${escHtml(fields.landlord_address || '')}

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Legal Notice demanding return of security deposit

Sir/Madam,

I, ${escHtml(fields.caller_name || '')}, formerly a tenant at ${escHtml(fields.property_address || '')}, write to demand the return of my security deposit.

I paid a security deposit of ${escHtml(fields.deposit_amount || '')} via ${escHtml(fields.payment_mode || '')} on ${escHtml(fields.deposit_date || '')}. I vacated the property on ${escHtml(fields.vacating_date || '')} after giving proper notice (${escHtml(fields.notice_given || '')}) and handing over keys (${escHtml(fields.keys_handed_over || '')}).

Despite vacating in good condition, you have refused to return the deposit. Reason given: ${escHtml(fields.refusal_reason || 'none stated')}.

Supporting documents available: ${escHtml(fields.proof_list || '')}.

You are hereby called upon to return the deposit of ${escHtml(fields.deposit_amount || '')} within ${escHtml((fields.deadline || '15 days').replace(' days',''))} days, failing which I will approach the Rent Authority / Consumer Forum / Civil Court for recovery with interest and compensation.

Yours faithfully,
${escHtml(fields.caller_name || '')}
${escHtml(fields.phone || '')}
${escHtml(fields.location || '')}`;

    } else if (type === 'rent_authority_complaint') {
      docText = `To,
The Rent Authority / Consumer Forum
[Jurisdiction Office]

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Complaint for recovery of withheld security deposit from ${escHtml(fields.landlord_name || '')}

Respected Sir/Madam,

I, ${escHtml(fields.caller_name || '')}, residing at ${escHtml(fields.location || '')}, contact: ${escHtml(fields.phone || '')}, submit this complaint against my former landlord ${escHtml(fields.landlord_name || '')}, residing at ${escHtml(fields.landlord_address || '')}.

I was a tenant at ${escHtml(fields.property_address || '')} and paid a security deposit of ${escHtml(fields.deposit_amount || '')}. I vacated on ${escHtml(fields.vacating_date || '')} but my landlord has refused to return the deposit. Reason given: ${escHtml(fields.refusal_reason || 'none stated')}.

Written demand submitted: ${escHtml(fields.written_demand_submitted || '')}. Authority approached earlier: ${escHtml(fields.authority_approached || 'none')}.

Supporting documents: ${escHtml(fields.proof_list || '')}.

I request appropriate action and direction to the landlord to return the deposit with interest.

Yours faithfully,
${escHtml(fields.caller_name || '')}
${escHtml(fields.phone || '')}`;

    } else if (type === 'grievance_application') {
      docText = `To,
The Grievance Officer
${escHtml(fields.authority_name || '[Department/Authority]')}

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Grievance Application regarding ${escHtml(fields.issue_category || 'pension issue')}

Respected Sir/Madam,

I, ${escHtml(fields.caller_name || '')}, residing at ${escHtml(fields.location || '')}, contact: ${escHtml(fields.phone || '')}, write to submit the following grievance.

Reference Number / PPO / EPFO Number: ${escHtml(fields.reference_number || 'Not available')}.
Application / Sanction Date: ${escHtml(fields.application_date || '')}.

Nature of Problem: ${escHtml(fields.problem_description || '')}.
Problem exists since: ${escHtml(fields.problem_start_date || '')}.

I contacted the department (${escHtml(fields.department_contacted || '')}). Response received: ${escHtml(fields.department_response || 'none')}.

Impact suffered: ${escHtml(fields.impact_suffered || '')}.

Supporting documents: ${escHtml(fields.proof_list || '')}.

I request immediate resolution of this grievance.

Yours faithfully,
${escHtml(fields.caller_name || '')}
${escHtml(fields.phone || '')}`;

    } else if (type === 'escalation_letter') {
      docText = `To,
The Higher Authority / Grievance Redressal Officer
${escHtml(fields.authority_name || '[Department/Authority]')}

Date: ${new Date().toLocaleDateString('en-IN')}

Sub: Escalation of unresolved grievance — ${escHtml(fields.reference_number || '')}

Respected Sir/Madam,

I, ${escHtml(fields.caller_name || '')}, residing at ${escHtml(fields.location || '')}, contact: ${escHtml(fields.phone || '')}, wish to escalate my unresolved grievance regarding ${escHtml(fields.problem_description || '')}.

Written grievance submitted: ${escHtml(fields.written_grievance_submitted || '')}. Written reply received: ${escHtml(fields.written_reply_received || 'none')}.

Higher authority / portal approached earlier: ${escHtml(fields.authority_approached || 'none')}.

Impact suffered: ${escHtml(fields.impact_suffered || '')}.

Supporting documents: ${escHtml(fields.proof_list || '')}.

I request urgent intervention and resolution.

Yours faithfully,
${escHtml(fields.caller_name || '')}
${escHtml(fields.phone || '')}`;

    } else {
      // Generic fallback
      docText = Object.entries(fields).map(([k, v]) =>
        `${k.replace(/_/g,' ').toUpperCase()}: ${Array.isArray(v) ? v.join(', ') : v}`
      ).join('\n');
    }

    return `<div class="doc-box">${docText}</div>`;
  }

  function shortTitle(str) {
    if (!str) return 'Document';
    // Take just "Document 1: ..." -> "Legal Notice" type short label
    const match = str.match(/Document \d+: (.+)/);
    if (match) return match[1].substring(0, 30) + (match[1].length > 30 ? '…' : '');
    return str.substring(0, 30);
  }

  window.switchTab = function(idx) {
    document.querySelectorAll('.doc-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
    document.querySelectorAll('.doc-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  };

  async function updateStatus(caseId, newStatus) {
    try {
      const res = await fetch(`/cases/${caseId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      });
      if (!res.ok) throw new Error('Failed');
      showToast(`✅ Status updated to "${newStatus}"`);
      await loadCases();
      await loadDetail(caseId);
    } catch (e) {
      showToast('⚠️ Could not update status');
    }
  }

  function timeAgo(isoStr) {
    const diff = Date.now() - new Date(isoStr);
    const mins = Math.floor(diff / 60000);
    if (mins < 2) return 'just now';
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function formatDate(isoStr) {
    return new Date(isoStr).toLocaleString('en-IN', {
      day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
    });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  loadCases();
  setInterval(loadCases, 30000);
</script>
</body>
</html>
